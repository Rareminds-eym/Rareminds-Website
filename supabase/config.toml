project_id = "Rareminds-Website"

[api]
enabled = true
port = 54351
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54352
shadow_port = 54350
major_version = 15

[db.pooler]
enabled = false
port = 54359
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = false
ip_version = "IPv4"

[studio]
enabled = true
port = 54353
api_url = "http://127.0.0.1:54351"
openai_api_key = "env(OPENAI_API_KEY)"

[local_smtp]
enabled = false
port = 54354
smtp_port = 54355
pop3_port = 54356

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_manual_linking = false
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
max_frequency = "5s"

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[auth.external.azure]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_AZURE_SECRET)"
