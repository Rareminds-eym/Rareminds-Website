<!DOCTYPE html>
<html>
  <body style="margin:0; padding:24px; background:#f4f6f8; font-family:Arial, Helvetica, sans-serif;">
    <div style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:8px; padding:32px; text-align:center;">
      <h2 style="margin:0 0 12px; color:#1a1a1a;">Verify your email</h2>
      <p style="margin:0 0 24px; color:#555555;">
        Enter this 6-digit code on the contact form:
      </p>
      <p style="margin:0 0 24px; font-size:36px; font-weight:bold; letter-spacing:8px; color:#1e88d4;">
        {{ .Token }}
      </p>
      <p style="margin:0; color:#888888; font-size:13px;">
        If you didn't request this, you can ignore this email.
      </p>
    </div>
  </body>
</html>
