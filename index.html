    <!-- Zoho SalesIQ Widget (Optimized: Lazy-loaded on interaction or idle to protect Core Web Vitals & TBT) -->
    <script>
      window.$zoho = window.$zoho || {};
      $zoho.salesiq = $zoho.salesiq || {
        ready: function () {}
      };
      
      var originalReady = $zoho.salesiq.ready;
      $zoho.salesiq.ready = function() {
        if (typeof originalReady === 'function') {
          originalReady();
        }
        
        var urlParams = new URLSearchParams(window.location.search);
        var openChat = urlParams.get('openChat');
        
        if (openChat === 'true' || openChat === '1') {
          setTimeout(function() {
            if ($zoho.salesiq && $zoho.salesiq.floatwindow) {
              $zoho.salesiq.floatwindow.visible('show');
            }
          }, 500);
        } else {
          setTimeout(function() {
            if ($zoho.salesiq && $zoho.salesiq.floatwindow) {
              $zoho.salesiq.floatwindow.visible('hide');
            }
          }, 500);
        }
      };

      function loadZohoSalesIQ() {
        if (window._zohoLoaded || document.getElementById('zsiqscript')) return;
        window._zohoLoaded = true;
        var script = document.createElement('script');
        script.id = 'zsiqscript';
        script.src = 'https://salesiq.zohopublic.in/widget?wc=siq85740827d442fdfad727c23eb50d61276e1e478af9841b5169a99498fc35da01';
        script.defer = true;
        document.body.appendChild(script);
      }

      var urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('openChat') === 'true' || urlParams.get('openChat') === '1') {
        loadZohoSalesIQ();
      } else {
        var userInteractionEvents = ['scroll', 'touchstart', 'pointerdown', 'keydown'];
        var triggerLoad = function() {
          loadZohoSalesIQ();
          userInteractionEvents.forEach(function(ev) {
            window.removeEventListener(ev, triggerLoad, { passive: true });
          });
        };
        userInteractionEvents.forEach(function(ev) {
          window.addEventListener(ev, triggerLoad, { once: true, passive: true });
        });
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(function() {
            setTimeout(loadZohoSalesIQ, 3500);
          });
        } else {
          setTimeout(loadZohoSalesIQ, 4000);
        }
      }
    </script>
